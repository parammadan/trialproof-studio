# Public demo on Fly.io (same image as the Dockerfile). The machine stops when idle and starts on the next visit.
#   fly deploy --remote-only        model key: fly secrets set TP_LLM_API_KEY=... (or in the Fly dashboard)
app = "trialproof-studio"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  TP_LLM_BASE_URL = "https://api.groq.com/openai/v1"
  TP_LLM_MODEL = "openai/gpt-oss-120b"
  # Groq free tier: 8k tokens per request and per minute
  TP_CONTEXT_CHARS = "12000"
  TP_LLM_MAX_TOKENS = "2048"
  # Fly's proxy sets (and overwrites) fly-client-ip; X-Forwarded-For is never trusted
  TP_CLIENT_IP_HEADER = "fly-client-ip"
  # when the main model's daily quota is used up, continue (visibly) on this one; it has its own daily quota
  TP_LLM_FALLBACK_MODEL = "openai/gpt-oss-20b"
  # model budgets per UTC day. Groq's free tier gives each model 200k tokens/day; one full workflow (inspect, spec,
  # program, run, fix, rerun) measured 60k-200k tokens, so a session gets enough for one, and the global cap stays
  # below the two models' combined daily quota
  TP_BUDGET_SESSION_TURNS = "25"
  TP_BUDGET_SESSION_TOKENS = "100000"
  TP_BUDGET_IP_TURNS = "40"
  TP_BUDGET_IP_TOKENS = "150000"
  TP_BUDGET_GLOBAL_TOKENS = "330000"

[http_service]
  internal_port = 7860
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    method = "GET"
    path = "/api/health"
    interval = "30s"
    timeout = "10s"
    grace_period = "30s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "2gb"  # one R run (1 GB address-space limit) plus the server
